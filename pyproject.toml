[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rarecare"
version = "0.1.0"
description = "Stigma-robust, guideline-grounded triage for women's cancers with calibrated uncertainty."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Anushka Nair" }]
dependencies = [
  "flask>=3.1,<4",
  "gunicorn>=23",
  "numpy>=2.0",
  "pillow>=11",
  "pydantic>=2.9,<3",
  "pyyaml>=6",
  "networkx>=3.3",
]

[project.optional-dependencies]
ml = [
  "torch>=2.4",
  "transformers>=4.46",
  "timm>=1.0",
  "faiss-cpu>=1.8",
  "presidio-analyzer>=2.2",
  "presidio-anonymizer>=2.2",
]
train = [
  "rarecare[ml]",
  "torchvision>=0.19",
  "datasets>=3.0",
  "scikit-learn>=1.5",
  "medmnist>=3.0",
  "pandas>=2.2",
  "matplotlib>=3.9",
  "huggingface_hub>=0.26",
]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13", "types-PyYAML"]

[tool.setuptools.packages.find]
include = ["rarecare*"]

[tool.setuptools.package-data]
rarecare = ["kg/data/*.json", "rag/corpus/*.jsonl", "app/templates/*.html", "app/static/*"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["rarecare"]

[[tool.mypy.overrides]]
module = ["rarecare.vision.model", "rarecare.vision.gradcam", "rarecare.rag.retriever", "rarecare.text.neural"]
disallow_untyped_calls = false
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
